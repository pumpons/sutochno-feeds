<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1200px; height: 1200px;
    font-family: 'Geologica', -apple-system, "Helvetica Neue", Arial, sans-serif;
  }
  body { position: relative; overflow: hidden; color: #fff; }

  .photo {
    position: absolute; inset: 0;
    background-image: url("{{ image_url }}");
    background-size: cover;
    background-position: center;
  }

  /* Затемнение сверху и снизу для читаемости */
  .scrim {
    position: absolute; inset: 0;
    background:
      linear-gradient(to bottom, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0) 28%),
      linear-gradient(to top,    rgba(0,0,0,0.70) 0%, rgba(0,0,0,0) 32%);
  }

  /* Рамка Crayola Red */
  .frame {
    position: absolute; inset: 16px;
    border: 4px solid #EE204D;
    border-radius: 18px;
    pointer-events: none;
  }

  .city {
    position: absolute;
    top: 56px; left: 56px;
    background: #EE204D;
    padding: 14px 28px;
    border-radius: 999px;
    font-size: 32px;
    font-weight: 600;
    letter-spacing: 0.3px;
  }

  .price {
    position: absolute;
    bottom: 64px; right: 64px;
    background: #EE204D;
    color: #fff;
    padding: 20px 36px;
    border-radius: 16px;
    font-size: 48px;
    font-weight: 800;
    box-shadow: 0 8px 24px rgba(0,0,0,0.35);
    line-height: 1;
  }
  .price .small { font-size: 24px; font-weight: 500; opacity: 0.9; }

  .name {
    position: absolute;
    bottom: 72px; left: 56px;
    max-width: 640px;
    font-size: 40px;
    font-weight: 700;
    line-height: 1.15;
    text-shadow: 0 2px 12px rgba(0,0,0,0.6);
  }

  .logo {
    position: absolute;
    top: 56px; right: 56px;
    width: 360px;
    height: auto;
    display: block;
    filter: drop-shadow(0 6px 18px rgba(0,0,0,0.4));
  }
</style>
</head>
<body>
  <div class="photo"></div>
  <div class="scrim"></div>
  <div class="frame"></div>

  <img src="{{ logo }}" class="logo" alt="">
  <div class="city">{{ destination }}</div>
  <div class="name">{{ name }}</div>
  <div class="price">
    {{ price }} ₽ <span class="small">/ночь</span>
  </div>
</body>
</html>
