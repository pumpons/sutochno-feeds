<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 628px; font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; }
  body { position: relative; overflow: hidden; color: #fff; }

  .photo {
    position: absolute; inset: 0;
    background-image: url("{{ image_url }}");
    background-size: cover;
    background-position: center;
  }

  /* Тёмный градиент снизу для читаемости текста */
  .scrim {
    position: absolute; inset: 0;
    background: linear-gradient(to top,
                rgba(0,0,0,0.75) 0%,
                rgba(0,0,0,0.35) 35%,
                rgba(0,0,0,0)    60%);
  }

  /* Золотая рамка */
  .frame {
    position: absolute; inset: 16px;
    border: 4px solid #d4af37;
    border-radius: 18px;
    pointer-events: none;
  }

  .city {
    position: absolute;
    top: 40px; left: 40px;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(8px);
    padding: 12px 24px;
    border-radius: 999px;
    font-size: 28px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }

  .price {
    position: absolute;
    bottom: 48px; right: 48px;
    background: linear-gradient(135deg, #d4af37 0%, #f6d57b 100%);
    color: #1a1a1a;
    padding: 18px 32px;
    border-radius: 14px;
    font-size: 42px;
    font-weight: 800;
    box-shadow: 0 8px 24px rgba(0,0,0,0.35);
  }
  .price .small { font-size: 22px; font-weight: 500; opacity: 0.85; }

  .name {
    position: absolute;
    bottom: 56px; left: 48px;
    max-width: 620px;
    font-size: 36px;
    font-weight: 700;
    line-height: 1.15;
    text-shadow: 0 2px 12px rgba(0,0,0,0.6);
  }

  .badge-premium {
    position: absolute;
    top: 40px; right: 40px;
    background: #d4af37;
    color: #1a1a1a;
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 20px;
    font-weight: 800;
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }
</style>
</head>
<body>
  <div class="photo"></div>
  <div class="scrim"></div>
  <div class="frame"></div>

  <div class="badge-premium">Premium</div>
  <div class="city">{{ destination }}</div>
  <div class="name">{{ name }}</div>
  <div class="price">
    {{ price }} ₽ <span class="small">/ночь</span>
  </div>
</body>
</html>
