<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1200px; height: 1200px;
    font-family: 'Geologica', -apple-system, "Helvetica Neue", Arial, sans-serif;
    background: #000;
  }
  body { position: relative; overflow: hidden; color: #fff; }

  .bg {
    position: absolute; inset: 0;
    background-image: url("{{ b02_bg }}");
    background-size: cover;
    background-position: center;
  }

  .card {
    position: absolute; left: 86px; top: 189px;
    width: 1025px; height: 658px;
    background: #393939;
    border-radius: 53px;
    overflow: hidden;
  }
  .card .photo {
    position: absolute; inset: 0;
    background-image: url("{{ image_url }}");
    background-size: cover;
    background-position: center;
  }

  .card .cashback {
    position: absolute; left: 89px; top: 39px;
    width: 481px; height: 63px;
  }
  .card .cashback img { width: 100%; height: 100%; display: block; }

  .card .price-pill {
    position: absolute; left: 636px; top: 517px;
    width: 305px; height: 87px;
    background: #fff;
    border-radius: 44px;
    display: flex; align-items: center; justify-content: center;
    color: #000;
    font-weight: 600;
    font-size: 53px;
    line-height: 1;
  }

  .card .city-pill {
    position: absolute; left: 89px; top: 515px;
    width: 297px; height: 90px;
    background: #fff;
    border-radius: 45px;
    display: flex; align-items: center; gap: 14px;
    padding: 0 30px;
    color: #000;
    font-weight: 400;
    font-size: 48px;
    line-height: 1;
  }
  .card .city-pill .geo { width: 29px; height: 39px; flex-shrink: 0; }
  .card .city-pill .geo img { width: 100%; height: 100%; display: block; }
  .card .city-pill .city-text {
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .name {
    position: absolute; left: 218px; top: 898px;
    width: 761px;
    text-align: center;
    font-weight: 700;
    font-size: 64px;
    line-height: 1.1;
    color: #fff;
  }
</style>
</head><body>
  <div class="bg"></div>
  <div class="card">
    <div class="photo"></div>
    <div class="cashback"><img src="{{ b_cashback }}" alt=""></div>
    <div class="city-pill">
      <div class="geo"><img src="{{ b_geo }}" alt=""></div>
      <div class="city-text">{{ destination }}</div>
    </div>
    <div class="price-pill">
      {%- if price is number -%}от {{ price|int }}₽{%- else -%}{{ price }}{%- endif -%}
    </div>
  </div>
  <div class="name">{{ name }}</div>
</body></html>
