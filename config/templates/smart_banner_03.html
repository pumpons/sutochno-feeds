<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@300;400;500;600;700&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1200px; height: 1200px;
    font-family: 'Geologica', -apple-system, "Helvetica Neue", Arial, sans-serif;
    background: #000;
  }
  body { position: relative; overflow: hidden; color: #fff; }

  .bg {
    position: absolute; inset: 0;
    background-image: url("{{ b03_bg }}");
    background-size: cover;
    background-position: center;
  }

  .logo {
    position: absolute; left: 355px; top: 185px;
    width: 492px; height: 76px;
  }
  .logo img { width: 100%; height: 100%; display: block; }

  .card {
    position: absolute; left: 87px; top: 306px;
    width: 1025px; height: 608px;
    background: #393939;
    border-radius: 53px;
    overflow: hidden;
  }
  .card .photo {
    position: absolute; inset: 0;
    background-image: url("{{ image_url }}");
    background-size: cover;
    background-position: center;
  }
  .card .heart {
    position: absolute; left: 585px; top: 20px;
    width: 88px; height: 88px;
  }
  .card .heart img { width: 100%; height: 100%; display: block; }

  .card .circles {
    position: absolute; left: 310px; top: 510px;
    width: 149px; height: 26px;
  }
  .card .circles img { width: 100%; height: 100%; display: block; }

  .card .cashback {
    position: absolute; left: 78px; top: 39px;
    width: 435px; height: 56px;
  }
  .card .cashback img { width: 100%; height: 100%; display: block; }

  .card .rating {
    position: absolute; left: 796px; top: 42px;
    width: 165px; height: 83px;
    background: #32a07c;
    border-radius: 166px;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    color: #fff;
    font-family: 'Inter', -apple-system, Arial, sans-serif;
    font-weight: 600;
    font-size: 45px;
    line-height: 1;
  }
  .card .rating .star { width: 47px; height: 47px; flex-shrink: 0; }
  .card .rating .star img { width: 100%; height: 100%; display: block; }
  .card .rating .score-text {
    padding-top: 2px;
  }

  .card .price-pill {
    position: absolute; left: 637px; top: 488px;
    width: 305px; height: 87px;
    background: #fff;
    border-radius: 60px;
    display: flex; align-items: center; justify-content: center;
    color: #000;
    font-weight: 600;
    font-size: 53px;
    line-height: 1;
  }

  .name {
    position: absolute; left: 316px; top: 944px;
    width: 567px;
    text-align: left;
    font-weight: 300;
    font-size: 61px;
    line-height: 1.1;
    color: #fff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
</style>
</head><body>
  <div class="bg"></div>

  <div class="logo"><img src="{{ b03_logo }}" alt=""></div>

  <div class="card">
    <div class="photo"></div>
    <div class="cashback"><img src="{{ b02_cashback }}" alt=""></div>
    <div class="heart"><img src="{{ b02_heart }}" alt=""></div>
    <div class="circles"><img src="{{ b02_circles }}" alt=""></div>
    {% if score and score|float > 0 %}
    <div class="rating">
      <div class="star"><img src="{{ b03_star }}" alt=""></div>
      <div class="score-text">{{ "%.1f"|format(score|float) | replace(".", ",") }}</div>
    </div>
    {% endif %}
    <div class="price-pill">
      {%- if price is number -%}от {{ price|int }}₽{%- else -%}{{ price }}{%- endif -%}
    </div>
  </div>

  <div class="name">{{ name }}</div>
</body></html>
