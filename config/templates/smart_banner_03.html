<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@300;400;500;600;700&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1200px; height: 1200px;
    font-family: 'Geologica', -apple-system, "Helvetica Neue", Arial, sans-serif;
    background: #000;
  }
  body { position: relative; overflow: hidden; color: #fff; }

  .bg {
    position: absolute; inset: 0;
    background-image: url("{{ b03_bg }}");
    background-size: cover;
    background-position: center;
  }

  .logo {
    position: absolute; left: 355px; top: 185px;
    width: 492px; height: 76px;
  }
  .logo img { width: 100%; height: 100%; display: block; }

  .card {
    position: absolute; left: 87px; top: 306px;
    width: 1025px; height: 608px;
    background: #393939;
    border-radius: 53px;
    overflow: hidden;
  }
  .card .photo {
    position: absolute; inset: 0;
    background-image: url("{{ image_url }}");
    background-size: cover;
    background-position: center;
  }

  .card .cashback {
    position: absolute; left: 87px; top: 42px;
    width: 481px; height: 63px;
  }
  .card .cashback img { width: 100%; height: 100%; display: block; }

  .card .rating {
    position: absolute; right: 82px; top: 42px;
    height: 83px;
    padding: 0 24px;
    background: #32a07c;
    border-radius: 1000px;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    color: #fff;
    font-family: 'Inter', -apple-system, Arial, sans-serif;
    font-weight: 600;
    font-size: 45px;
    line-height: 1;
  }
  .card .rating .star { width: 47px; height: 47px; flex-shrink: 0; }
  .card .rating .star img { width: 100%; height: 100%; display: block; }
  .card .rating .score-text { padding-top: 2px; white-space: nowrap; }

  .card .price-pill {
    position: absolute; right: 83px; top: 488px;
    height: 87px;
    padding: 0 36px;
    background: #fff;
    border-radius: 1000px;
    display: inline-flex; align-items: center; justify-content: center;
    color: #000;
    font-weight: 600;
    font-size: 53px;
    line-height: 1;
    white-space: nowrap;
  }

  .name {
    position: absolute; left: 87px; right: 87px; top: 920px;
    text-align: center;
    font-weight: 300;
    font-size: 61px;
    line-height: 1.1;
    color: #fff;
    word-break: break-word;
    overflow-wrap: break-word;
    display: -webkit-box;
    -webkit-line-clamp: 4;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
</style>
</head><body>
  <div class="bg"></div>
  <div class="logo"><img src="{{ b03_logo }}" alt=""></div>
  <div class="card">
    <div class="photo"></div>
    <div class="cashback"><img src="{{ b_cashback }}" alt=""></div>
    {% if score and score|float > 0 %}
    <div class="rating">
      <div class="star"><img src="{{ b_star }}" alt=""></div>
      <div class="score-text">{{ "%.1f"|format(score|float) | replace(".", ",") }}</div>
    </div>
    {% endif %}
    <div class="price-pill">
      {%- if price is number -%}от {{ price|int }}₽{%- else -%}{{ price }}{%- endif -%}
    </div>
  </div>
  <div class="name">{{ name }}</div>
</body></html>
