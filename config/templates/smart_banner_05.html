<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@300;400;500;600;700&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1200px; height: 1200px;
    font-family: 'Geologica', -apple-system, "Helvetica Neue", Arial, sans-serif;
    background: #000;
  }
  body { position: relative; overflow: hidden; color: #fff; }

  .photo {
    position: absolute; inset: 0;
    background-image: url("{{ image_url }}");
    background-size: cover;
    background-position: center;
  }

  .cashback {
    position: absolute; left: 174px; top: 423px;
    width: 481px; height: 63px;
  }
  .cashback img { width: 100%; height: 100%; display: block; }

  .rating {
    position: absolute; left: 174px; top: 520px;
    height: 62px;
    padding: 0 18px;
    background: #32a07c;
    backdrop-filter: blur(40px);
    -webkit-backdrop-filter: blur(40px);
    border-radius: 1000px;
    display: inline-flex; align-items: center; justify-content: center; gap: 5px;
    color: #fff;
    font-family: 'Inter', -apple-system, Arial, sans-serif;
    font-weight: 600;
    font-size: 34px;
    line-height: 1;
  }
  .rating .star { width: 35px; height: 35px; flex-shrink: 0; }
  .rating .star img { width: 100%; height: 100%; display: block; }
  .rating .score-text { padding-top: 2px; white-space: nowrap; }

  .price-pill {
    position: absolute; left: 174px; top: 617px;
    height: 63px;
    padding: 0 22px;
    background: #000;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-radius: 1000px;
    display: inline-flex; align-items: center; justify-content: center;
    color: #fff;
    font-weight: 600;
    font-size: 38px;
    line-height: 1;
    white-space: nowrap;
  }

  .name-pill {
    position: absolute; left: 174px; top: 714px;
    max-width: 852px;
    min-height: 63px;
    padding: 12px 22px;
    background: #fff;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-radius: 32px;
    display: inline-flex; align-items: center; justify-content: center;
    color: #000;
    font-weight: 600;
    font-size: 38px;
    line-height: 1.2;
  }
  .name-pill .name-text {
    text-align: center;
    word-break: break-word;
    overflow-wrap: break-word;
  }
</style>
</head><body>
  <div class="photo"></div>
  <div class="cashback"><img src="{{ b_cashback }}" alt=""></div>
  {% if score and score|float > 0 %}
  <div class="rating">
    <div class="star"><img src="{{ b_star }}" alt=""></div>
    <div class="score-text">{{ "%.1f"|format(score|float) | replace(".", ",") }}</div>
  </div>
  {% endif %}
  <div class="price-pill">
    {%- if price is number -%}от {{ price|int }}₽{%- else -%}{{ price }}{%- endif -%}
  </div>
  <div class="name-pill"><div class="name-text">{{ name }}</div></div>
</body></html>
