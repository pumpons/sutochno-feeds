name: Daily feed rebuild

on:
  schedule:
    - cron: "0 0 * * *"   # 03:00 MSK = 00:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: daily-feeds
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      RENDER_CONCURRENCY: "8"
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      # Cache rendered images between runs, keyed by template+asset fingerprint
      # so any visual change invalidates the cache cleanly.
      - name: Compute cache key
        id: cache-key
        run: |
          KEY=$(find config/templates -type f | sort | xargs sha1sum | sha1sum | cut -c1-16)
          echo "key=$KEY" >> "$GITHUB_OUTPUT"

      - name: Restore image cache
        uses: actions/cache@v4
        with:
          path: output/images
          key: images-${{ steps.cache-key.outputs.key }}

      - name: Run pipeline
        run: python -m src.pipeline

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./output

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
